name: Re-run build with additional checks after PR approval

on:
  pull_request_review:
    types: [submitted]

jobs:
  retrigger:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-24.04
    steps:
      - name: Retrigger build workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            repos/${{ github.repository }}/actions/workflows/build-and-release-if-needed.yml/dispatches \
            -f ref=${{ github.event.pull_request.head.ref }}