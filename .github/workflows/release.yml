name: Release
run-name: ${{ (github.event_name == 'workflow_dispatch' && inputs.preview) && 'Preview Release' || 'Release' }} (${{ github.ref_name }} ${{ github.sha }})

on:
  workflow_dispatch:
    inputs:
      preview:
        description: 'Preview release'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  checks: write
  contents: write
  pull-requests: read

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      release_sha: ${{ steps.prepare.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
          persist-credentials: false
      - uses: ./.github/actions/setup-env
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_STREAMX_RELEASES_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_STREAMX_RELEASES_SNAPSHOT_DEPLOY_SA }}
          gar_docker_registry: ${{ vars.GAR_DOCKER_REGISTRY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_STREAMX_RELEASE_APP_ID }}
          private-key: ${{ secrets.GH_STREAMX_RELEASE_APP_PRIVATE_KEY }}
          owner: streamx-com
          repositories: streamx-cli

      - name: Prepare release
        id: prepare
        run: |
          git config user.name "streamx-cli-release-bot[bot]"
          git config user.email "264353404+streamx-cli-release-bot[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git"

          EXTRA_ARGS=""
          PREVIEW=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PREVIEW="${{ inputs.preview }}"
          fi

          if [[ "$PREVIEW" == "true" ]]; then
            CURRENT_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
            BASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
            SHORT_SHA=$(git rev-parse --short HEAD)
            EXTRA_ARGS="-DreleaseVersion=${BASE_VERSION}-rc.${SHORT_SHA} -DdevelopmentVersion=${CURRENT_VERSION}"
          fi

          ./mvnw -B release:prepare \
            -Darguments="-DskipTests" \
            -P release \
            -DpushChanges=false \
            $EXTRA_ARGS

          RELEASE_VERSION=$(git describe --tags --abbrev=0)
          RELEASE_SHA=$(git rev-list -n 1 "$RELEASE_VERSION")

          git push origin HEAD:${{ github.ref_name }} "${RELEASE_VERSION}"

          echo "tag=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Prepared release: $RELEASE_VERSION ($RELEASE_SHA)"

  build:
    needs: prepare-release
    uses: ./.github/workflows/build-cross-platform.yml
    with:
      ref: ${{ needs.prepare-release.outputs.release_sha }}
    secrets: inherit

  release:
    needs: [prepare-release, build]
    runs-on: ubuntu-24.04
    outputs:
      brew_tap_slug: ${{ steps.release-type.outputs.brew_tap_slug }}
      release_repo: ${{ steps.release-type.outputs.release_repo }}
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          fetch-tags: true
      - uses: ./.github/actions/setup-env
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # TEMPORARY(native): restore when native image builds again.
      # - name: Download native binary artifacts
      #   uses: actions/download-artifact@v4
      #   with:
      #     path: artifacts
      #     pattern: streamx-*
      #     merge-multiple: true

      - name: Download JAR artifacts
        uses: actions/download-artifact@v4
        with:
          name: streamx-runner-jar
          path: target/

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_STREAMX_RELEASE_APP_ID }}
          private-key: ${{ secrets.GH_STREAMX_RELEASE_APP_PRIVATE_KEY }}
          owner: streamx-com
          repositories: homebrew-tap,homebrew-preview-tap,streamx-cli,streamx-cli-preview

      - name: Determine release type
        id: release-type
        run: |
          if [[ "${{ inputs.preview }}" == "true" ]]; then
            echo "type=preview" >> $GITHUB_OUTPUT
            echo "jreleaser_config=.github/jreleaser/jreleaser-preview.yml" >> $GITHUB_OUTPUT
            echo "brew_tap=homebrew-preview-tap" >> $GITHUB_OUTPUT
            echo "brew_tap_slug=streamx-com/preview-tap" >> $GITHUB_OUTPUT
            echo "release_repo=streamx-com/streamx-cli-preview" >> $GITHUB_OUTPUT
          else
            echo "type=stable" >> $GITHUB_OUTPUT
            echo "jreleaser_config=.github/jreleaser/jreleaser.yml" >> $GITHUB_OUTPUT
            echo "brew_tap=homebrew-tap" >> $GITHUB_OUTPUT
            echo "brew_tap_slug=streamx-com/tap" >> $GITHUB_OUTPUT
            echo "release_repo=streamx-com/streamx-cli" >> $GITHUB_OUTPUT
          fi
          echo "Release type: $(grep type <<< "$(cat $GITHUB_OUTPUT)" | head -1)"

      - name: Release with JReleaser
        env:
          JRELEASER_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          JRELEASER_HOMEBREW_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          # TEMPORARY(native): restore when native image builds again.
          # chmod +x artifacts/streamx-*

          echo "Generate shell completions from JAR"
          mkdir -p artifacts/completions
          java -jar target/*-runner.jar completion bash > artifacts/completions/streamx.bash
          java -jar target/*-runner.jar completion zsh > artifacts/completions/_streamx

          # TEMPORARY(native): restore when native image builds again.
          # echo "Pre-create platform ZIPs for native binaries"
          # for PLATFORM in linux-x86_64 linux-aarch64 macos-aarch64 macos-x86_64; do
          #   mkdir -p staging/$PLATFORM/bin
          #   mkdir -p staging/$PLATFORM/share/completions
          #   cp artifacts/streamx-$PLATFORM staging/$PLATFORM/bin/streamx
          #   cp artifacts/completions/streamx.bash staging/$PLATFORM/share/completions/
          #   cp artifacts/completions/_streamx staging/$PLATFORM/share/completions/
          #   cp LICENSE.txt staging/$PLATFORM/
          #   cd staging
          #   zip -r ../artifacts/streamx-${RELEASE_TAG}-${PLATFORM}.zip $PLATFORM/
          #   cd ..
          # done

          echo "Prepare Java binary JAR"
          cp target/*-runner.jar artifacts/streamx-jar.jar

          ./mvnw jreleaser:assemble jreleaser:full-release \
            -Djreleaser.config.file=${{ steps.release-type.outputs.jreleaser_config }} \
            -Djreleaser.strict=true

      - name: Upload JReleaser output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-output
          path: |
            target/jreleaser/trace.log
            target/jreleaser/output.properties

      - name: Create versioned Homebrew formulas
        env:
          HOMEBREW_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          BREW_TAP: ${{ steps.release-type.outputs.brew_tap }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          git clone https://x-access-token:${HOMEBREW_GITHUB_TOKEN}@github.com/streamx-com/${BREW_TAP}.git
          cd ${BREW_TAP}/Formula

          CLASS_SUFFIX=$(echo "$RELEASE_TAG" | sed -E 's/[^a-zA-Z0-9]+([a-zA-Z])/\U\1/g; s/[^a-zA-Z0-9]//g')

          # TEMPORARY(native): only the JVM formula while native is disabled;
          # restore to "streamx streamx-jvm" when native builds again.
          for BASE_FORMULA in streamx-jvm; do
            FILENAME="${BASE_FORMULA}@${RELEASE_TAG}.rb"

            if [ -f "$FILENAME" ]; then
              echo "Versioned formula ${FILENAME} already exists, skipping."
              continue
            fi

            if [ ! -f "${BASE_FORMULA}.rb" ]; then
              echo "Base formula ${BASE_FORMULA}.rb not found, skipping."
              continue
            fi

            echo "Creating versioned formula ${FILENAME}"
            cp "${BASE_FORMULA}.rb" "$FILENAME"

            # Derive the class name from the base formula name
            # streamx -> Streamx, streamx-jvm -> StreamxJvm
            BASE_CLASS=$(echo "$BASE_FORMULA" | sed -E 's/(^|-)([a-z])/\U\2/g')
            sed -i "s/class ${BASE_CLASS}/class ${BASE_CLASS}AT${CLASS_SUFFIX}/" "$FILENAME"

            git add "$FILENAME"
          done

          if git diff --cached --quiet; then
            echo "No new versioned formulas to commit."
          else
            git config user.name "streamx-cli-release-bot[bot]"
            git config user.email "264353404+streamx-cli-release-bot[bot]@users.noreply.github.com"
            git commit -m "Add versioned formulas for ${RELEASE_TAG}"
            git push
          fi

  release-test:
    needs: [prepare-release, build, release]
    name: ${{ matrix.name }}-release-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # TEMPORARY(native): only JVM/JAR tests run, which need no per-platform build
        # artifacts, so the matrix is decoupled from the build platforms to keep macOS
        # covered. Restore: include: ${{ fromJSON(needs.build.outputs.platforms) }}
        include:
          - { os: ubuntu-24.04, name: linux-amd64 }
          - { os: macos-26-xlarge, name: macos-arm64 }
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
      - uses: ./.github/actions/setup-env
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_STREAMX_RELEASE_APP_ID }}
          private-key: ${{ secrets.GH_STREAMX_RELEASE_APP_PRIVATE_KEY }}
          owner: streamx-com
          repositories: homebrew-tap,homebrew-preview-tap,streamx-cli,streamx-cli-preview

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      # TEMPORARY(native): restore when native image builds again.
      # - name: Test Homebrew install
      #   run: |
      #     echo "Test latest version"
      #     brew install ${{ needs.release.outputs.brew_tap_slug }}/streamx
      #     streamx --version | grep -q "${RELEASE_TAG}"
      #
      #     echo "Verify shell completions were installed"
      #     test -f "$(brew --prefix)/etc/bash_completion.d/streamx"
      #     test -f "$(brew --prefix)/share/zsh/site-functions/_streamx"
      #
      #     brew uninstall streamx
      #
      #     echo "Test versioned formula"
      #     brew install ${{ needs.release.outputs.brew_tap_slug }}/streamx@${RELEASE_TAG}
      #     streamx --version | grep -q "${RELEASE_TAG}"
      #     brew uninstall streamx@${RELEASE_TAG}

      - name: Test Homebrew JVM install
        run: |
          echo "Test latest JVM version"
          brew install ${{ needs.release.outputs.brew_tap_slug }}/streamx-jvm
          streamx --version | grep -q "${RELEASE_TAG}"

          echo "Verify shell completions were installed"
          test -f "$(brew --prefix)/etc/bash_completion.d/streamx"
          test -f "$(brew --prefix)/share/zsh/site-functions/_streamx"

          brew uninstall streamx-jvm

          echo "Test versioned JVM formula"
          brew install ${{ needs.release.outputs.brew_tap_slug }}/streamx-jvm@${RELEASE_TAG}
          streamx --version | grep -q "${RELEASE_TAG}"
          brew uninstall streamx-jvm@${RELEASE_TAG}

      # TEMPORARY(native): restore when native image builds again.
      # - name: Test native binary from GitHub release
      #   env:
      #     GH_TOKEN: ${{ steps.app-token.outputs.token }}
      #   run: |
      #     gh release download "${RELEASE_TAG}" \
      #       --repo "${{ needs.release.outputs.release_repo }}" \
      #       --pattern "${{ matrix.artifact }}" \
      #       --dir .
      #     chmod +x ${{ matrix.artifact }}
      #     ./${{ matrix.artifact }} --version | grep -q "${RELEASE_TAG}"
      #
      # - name: Test native archive from GitHub release
      #   env:
      #     GH_TOKEN: ${{ steps.app-token.outputs.token }}
      #   run: |
      #     ARCHIVE_PLATFORM=$(echo "${{ matrix.artifact }}" | sed 's/^streamx-//')
      #     gh release download "${RELEASE_TAG}" \
      #       --repo "${{ needs.release.outputs.release_repo }}" \
      #       --pattern "streamx-*-${ARCHIVE_PLATFORM}.zip" \
      #       --dir .
      #     unzip streamx-*-${ARCHIVE_PLATFORM}.zip
      #     ./${ARCHIVE_PLATFORM}/bin/streamx --version | grep -q "${RELEASE_TAG}"

      - name: Test JAR archive from GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release download "${RELEASE_TAG}" \
            --repo "${{ needs.release.outputs.release_repo }}" \
            --pattern "streamx-jar-*.zip" \
            --dir .
          unzip streamx-jar-*.zip
          streamx-jar-*/bin/streamx --version | grep -q "${RELEASE_TAG}"

      # TEMPORARY(native): install.sh downloads native binaries; restore when native builds again.
      # - name: Test install script
      #   run: ./install.sh.test "${RELEASE_TAG}"