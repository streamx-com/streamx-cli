name: 'Build and release if tag found'

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - '*'

run-name: >-
  ${{
    startsWith(github.ref, 'refs/tags/')
      && format('Build for release {0}', github.ref_name)
    || format('Build {0} - {1}', github.head_ref || github.ref_name,
         github.event.pull_request.head.sha || github.sha)
  }}

permissions:
  id-token: write
  checks: write
  contents: write
  pull-requests: read

jobs:
  setup:
    runs-on: ubuntu-24.04
    name: setup
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
      - name: Define platform matrix
        id: matrix
        run: |
          PLATFORMS='[
            { "os": "ubuntu-24.04",     "name": "linux-amd64",  "artifact": "streamx-linux-x86_64" },
            { "os": "ubuntu-24.04-arm", "name": "linux-arm64",  "artifact": "streamx-linux-aarch64" },
            { "os": "macos-26",         "name": "macos-arm64",  "artifact": "streamx-macos-aarch64" },
            { "os": "macos-26-intel",   "name": "macos-amd64",  "artifact": "streamx-macos-x86_64" }
          ]'
          echo "platforms=$(echo "$PLATFORMS" | jq -c .)" >> "$GITHUB_OUTPUT"

  build-jar:
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-env
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_STREAMX_RELEASES_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_STREAMX_RELEASES_RELEASE_DEPLOY_SA }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests with native-image-agent
        run: |
          .github/scripts/with-capture-docker-logs.sh ./mvnw verify -Pci

      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs-${{ github.job }}
          path: target/docker-logs/
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: scacap/action-surefire-report@v1
        with:
          check_name: Test report - generate-reachability-metadata

      - name: Upload reachability metadata
        uses: actions/upload-artifact@v4
        with:
          name: reachability-metadata
          path: src/main/resources/META-INF/native-image/

      - name: Upload runner JAR
        uses: actions/upload-artifact@v4
        with:
          name: streamx-runner-jar
          path: target/*-runner.jar

  build-native:
    needs: [setup, build-jar]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}-build
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-env
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_STREAMX_RELEASES_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_STREAMX_RELEASES_RELEASE_DEPLOY_SA }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download reachability metadata
        uses: actions/download-artifact@v4
        with:
          name: reachability-metadata
          path: src/main/resources/META-INF/native-image/

      - name: Build native-image executable
        run: |
          .github/scripts/with-capture-docker-logs.sh ./mvnw verify -Pci,native

      - name: Upload test reports
        if: always()
        uses: scacap/action-surefire-report@v1
        with:
          check_name: Test report - build ${{ matrix.name }}

      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs-${{ matrix.name }}
          path: target/docker-logs/
          if-no-files-found: ignore

      - name: Prepare artifact
        run: |
          mkdir -p staging
          cp target/*-runner staging/${{ matrix.artifact }}
          chmod +x staging/${{ matrix.artifact }}

      - name: Smoke test
        run: ./staging/${{ matrix.artifact }} --help

      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: staging/${{ matrix.artifact }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [setup, build-native]
    uses: ./.github/workflows/release.yml
    with:
      platforms: ${{ needs.setup.outputs.platforms }}
    secrets: inherit