descriptors:
  relay:
    type: "processing"
    containers:
      service:
        incoming:
          events: {}
        outgoing:
          relayed-events: {}

  web-server-sink:
    type: "edge"
    containers:
      sink:
        image: "ghcr.io/streamx-com/streamx-blueprints/web-server-sink:3.0.7-jvm"
        incoming:
          resources: {}
        servicePorts:
          - "8087:8080"

sources:
  cli:
    outgoing:
      - ref: "inbox.pages"
        produces:
          - "com.streamx.blueprints.asset.published.v1"
          - "com.streamx.blueprints.asset.unpublished.v1"
          - "com.streamx.blueprints.composition.published.v1"
          - "com.streamx.blueprints.composition.unpublished.v1"
          - "com.streamx.blueprints.data.published.v1"
          - "com.streamx.blueprints.data.unpublished.v1"
          - "com.streamx.blueprints.download.request.v1"
          - "com.streamx.blueprints.download.schedule.v1"
          - "com.streamx.blueprints.download.unschedule.v1"
          - "com.streamx.blueprints.fragment.published.v1"
          - "com.streamx.blueprints.fragment.unpublished.v1"
          - "com.streamx.blueprints.indexable-resource-fragment.published.v1"
          - "com.streamx.blueprints.indexable-resource-fragment.unpublished.v1"
          - "com.streamx.blueprints.indexable-resource.published.v1"
          - "com.streamx.blueprints.indexable-resource.unpublished.v1"
          - "com.streamx.blueprints.layout.published.v1"
          - "com.streamx.blueprints.layout.unpublished.v1"
          - "com.streamx.blueprints.optimized-asset.published.v1"
          - "com.streamx.blueprints.optimized-asset.unpublished.v1"
          - "com.streamx.blueprints.page.published.v1"
          - "com.streamx.blueprints.page.unpublished.v1"
          - "com.streamx.blueprints.renderer.published.v1"
          - "com.streamx.blueprints.renderer.unpublished.v1"
          - "com.streamx.blueprints.rendering-context.published.v1"
          - "com.streamx.blueprints.rendering-context.unpublished.v1"
          - "com.streamx.blueprints.web-resource.published.v1"
          - "com.streamx.blueprints.web-resource.unpublished.v1"

ingestion:
  rest-ingestion:
    containers:
      proxy:
        environment:
          QUARKUS_HTTP_AUTH_PERMISSION_BEARER_POLICY: permit

processing:
  pages-relay:
    descriptor: relay
    containers:
      service:
        incoming:
          events:
            ref: inbox.pages
        outgoing:
          relayed-events:
            ref: outbox.pages

edge:
  web-server-sink:
    descriptor: web-server-sink
    containers:
      sink:
        incoming:
          resources:
            ref: outbox.pages
