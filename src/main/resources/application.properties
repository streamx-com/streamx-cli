quarkus.package.jar.type=uber-jar

# Default endpoints offered by `streamx context configure` (baked in at build time).
# Ingestion has no default: its URL is per-project (ingestion.<project>.<gateway-root-domain>).
# TEMPORARY. Restore before release:
#   streamx.defaults.auth.server-url=https://auth.streamx.com
#   streamx.defaults.platform.url=https://cloud.streamx.com
streamx.defaults.auth.server-url=https://auth.demo-1.82-29-94-68.sslip.io:1443
streamx.defaults.platform.url=https://console.demo-1.82-29-94-68.sslip.io:1443

quarkus.banner.enabled=false
quarkus.log.level=ERROR
quarkus.log.console.enable=true
quarkus.log.console.level=ERROR

quarkus.log.category."io.quarkus".level=OFF
quarkus.log.category."io.quarkus.runtime".level=ERROR
quarkus.log.category."org.jboss".level=OFF

# Native image
quarkus.native.additional-build-args=\
    --initialize-at-run-time=org.apache.http.impl.auth,\
    --initialize-at-run-time=org.jline.nativ,\
    --initialize-at-run-time=org.jline.terminal.impl.jansi,\
    --initialize-at-run-time=org.jline.terminal.impl.ffm,\
    --initialize-at-run-time=jdk.internal.org.jline.terminal.impl.ffm,\
    --initialize-at-run-time=org.apache.commons.logging.impl.Log4jApiLogFactory

# Fixes "Cannot load required properties from maven-build.properties" error
# when run streamx-runner with native-image executable.
quarkus.native.resources.includes=maven-build.properties,default-event-templates/**,container/**
# OpenAPI-generated platform client (spec unpacked from streamx-platform-aggregated-openapi)
quarkus.openapi-generator.codegen.spec.openapi_yaml.base-package=com.streamx.cli.platform.generated
# The aggregated spec repeats the X-Permission-Check header on every operation (invalid per the
# OpenAPI param-uniqueness rule); skip validation so codegen proceeds and dedupes it.
quarkus.openapi-generator.codegen.validateSpec=false
# Every operation returns jakarta.ws.rs.core.Response so the client factory has one uniform
# path for auth-retry, error mapping and body deserialization.
quarkus.openapi-generator.codegen.spec.openapi_yaml.return-response=true
